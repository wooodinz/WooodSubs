name: Build & Release WooodSubs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate icon
        run: python assets/generate_icon.py

      - name: Build standalone Windows EXE
        run: pyinstaller --clean --noconfirm wx20.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WooodSubs-Windows
          path: dist/WooodSubs.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WooodSubs.exe
